<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('photo_3.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* النص في المنتصف */
        .center-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
            white-space: nowrap;
            z-index: 5;
            pointer-events: none;
        }

        /* النمط العام لمشغلات الجرامافون */
        .gramophone-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
            cursor: pointer;
        }

        /* مواضع الأقراص الأربعة في الزوايا حسب الترتيب بالصورة */
        /* 1: أعلى اليسار */
        .player-1 {
            top: 25px;
            left: 25px;
        }

        /* 2: أعلى اليمين */
        .player-2 {
            top: 25px;
            right: 25px;
        }

        /* 3: أسفل اليسار */
        .player-3 {
            bottom: 25px;
            left: 25px;
        }

        /* 4: أسفل اليمين */
        .player-4 {
            bottom: 25px;
            right: 25px;
        }

        /* تصميم قرص الغرامافون */
        .vinyl-record {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: repeating-radial-gradient(
                #111111,
                #111111 2px,
                #292929 3px,
                #111111 4px
            );
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7), inset 0 0 0 2px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease;
        }

        /* مركز القرص */
        .record-label {
            width: 35px;
            height: 35px;
            background: #d4af37; /* لون ذهبي */
            border-radius: 50%;
            border: 2px solid #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .record-label::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #000;
            border-radius: 50%;
        }

        /* أنيميشن الدوران */
        .spinning {
            animation: rotateRecord 2.5s linear infinite;
        }

        @keyframes rotateRecord {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* أزرار التحكم */
        .play-toggle-btn {
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 14px;
            border-radius: 15px;
            font-size: 12px;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .gramophone-container:hover .play-toggle-btn {
            background: rgba(212, 175, 55, 0.85);
            color: #000;
        }
    </style>
</head>
<body>

    <!-- النص في منتصف الشاشة -->
    <div class="center-title">إلى حبيبتي إسراء</div>

    <!-- القرص 1 (أعلى اليسار) -->
    <div class="gramophone-container player-1" onclick="toggleMusic(1)">
        <div class="vinyl-record" id="record1">
            <div class="record-label"></div>
        </div>
        <button class="play-toggle-btn" id="btn1">تشغيل 🎵</button>
        <audio id="audio1" loop src="Fayrouz  PLAY by Reema Rahbany.m4a"></audio>
    </div>

    <!-- القرص 2 (أعلى اليمين) -->
    <div class="gramophone-container player-2" onclick="toggleMusic(2)">
        <div class="vinyl-record" id="record2">
            <div class="record-label"></div>
        </div>
        <button class="play-toggle-btn" id="btn2">تشغيل 🎵</button>
        <audio id="audio2" loop src="Wahdon CD 1 TRACK 5 (320).mp3"></audio> 
    </div>

    <!-- القرص 3 (أسفل اليسار) -->
    <div class="gramophone-container player-3" onclick="toggleMusic(3)">
        <div class="vinyl-record" id="record3">
            <div class="record-label"></div>
        </div>
        <button class="play-toggle-btn" id="btn3">تشغيل 🎵</button>
        <audio id="audio3" loop src="Fairuz - Kifak Inta.mp3"></audio> 
    </div>

    <!-- القرص 4 (أسفل اليمين) -->
    <div class="gramophone-container player-4" onclick="toggleMusic(4)">
        <div class="vinyl-record" id="record4">
            <div class="record-label"></div>
        </div>
        <button class="play-toggle-btn" id="btn4">تشغيل 🎵</button>
        <audio id="audio4" loop src="Fairuz - Indi Thika Feek.mp3"></audio> 
    </div>

    <script>
        function toggleMusic(id) {
            // إيقاف جميع الأغاني وأقراص الدوران الأخرى أولاً
            for (let i = 1; i <= 4; i++) {
                const audio = document.getElementById(`audio${i}`);
                const record = document.getElementById(`record${i}`);
                const btn = document.getElementById(`btn${i}`);

                if (i === id) {
                    if (audio.paused) {
                        audio.play();
                        record.classList.add('spinning');
                        btn.textContent = 'إيقاف ⏸';
                    } else {
                        audio.pause();
                        record.classList.remove('spinning');
                        btn.textContent = 'تشغيل 🎵';
                    }
                } else {
                    audio.pause();
                    record.classList.remove('spinning');
                    btn.textContent = 'تشغيل 🎵';
                }
            }
        }
    </script>
</body>
</html>
