<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel web</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('photo_3.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* طبقة تظليم خفيفة لإبراز العناصر */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        /* النص العلوي */
        .center-title {
            position: relative;
            z-index: 5;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            margin-top: 30px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
        }

        /* حاوية مشغل MD Vinyl */
        .player-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 380px;
        }

        /* قرص الفينيل الرئيسي */
        .turntable-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl-record {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: repeating-radial-gradient(
                #111111,
                #111111 2px,
                #222222 3px,
                #111111 5px
            );
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), inset 0 0 0 2px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }

        /* مركز القرص */
        .record-label {
            width: 80px;
            height: 80px;
            background: #d4af37;
            border-radius: 50%;
            border: 4px solid #111;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .record-label::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
        }

        /* ذراع الجرامافون (Tonearm) */
        .tonearm {
            position: absolute;
            top: -10px;
            right: 10px;
            width: 80px;
            height: 160px;
            pointer-events: none;
            transform-origin: 65px 20px;
            transform: rotate(-30deg); /* الوضع الأساسي: بعيد عن القرص */
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .tonearm-base {
            position: absolute;
            top: 10px;
            right: 50px;
            width: 30px;
            height: 30px;
            background: #444;
            border-radius: 50%;
            border: 2px solid #666;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }

        .tonearm-stick {
            position: absolute;
            top: 25px;
            right: 62px;
            width: 6px;
            height: 120px;
            background: linear-gradient(to right, #bbb, #eee, #999);
            border-radius: 3px;
            transform: rotate(-15deg);
        }

        .tonearm-head {
            position: absolute;
            bottom: 15px;
            right: 83px;
            width: 14px;
            height: 25px;
            background: #222;
            border-radius: 2px;
            transform: rotate(-15deg);
        }

        /* تحريك الذراع والدوران عند التشغيل */
        .playing .tonearm {
            transform: rotate(0deg); /* استقرار الذراع فوق القرص */
        }

        .playing .vinyl-record {
            animation: rotateRecord 3s linear infinite;
            animation-delay: 0.6s; /* يبدأ الدوران بعد نزول الذراع */
        }

        @keyframes rotateRecord {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* اسم الأغنية */
        .track-info {
            text-align: center;
            color: #fff;
            margin-top: 25px;
        }

        .track-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .track-artist {
            font-size: 14px;
            color: #ccc;
        }

        /* أزرار التحكم السفيلة (MD Vinyl Style) */
        .controls-container {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 40px;
            width: 100%;
        }

        .control-btn {
            background: rgba(30, 30, 30, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .control-btn:hover {
            background: rgba(212, 175, 55, 0.85);
            color: #000;
            transform: translateY(-2px);
        }

        .play-btn {
            padding: 14px 32px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- العنوان العلوي -->
    <div class="center-title">To my beloved israa</div>

    <!-- مشغل الفينيل المركزي -->
    <div class="player-wrapper" id="playerWrapper">
        <div class="turntable-container">
            <!-- ذراع الجرامافون -->
            <div class="tonearm">
                <div class="tonearm-base"></div>
                <div class="tonearm-stick"></div>
                <div class="tonearm-head"></div>
            </div>

            <!-- قرص الفينيل -->
            <div class="vinyl-record">
                <div class="record-label"></div>
            </div>
        </div>

        <!-- تفاصيل الأغنية الحالية -->
        <div class="track-info">
            <div class="track-title" id="trackTitle">اسم الأغنية</div>
            <div class="track-artist" id="trackArtist">فيروز</div>
        </div>
    </div>

    <!-- عنصر الصوت -->
    <audio id="audioPlayer"></audio>

    <!-- أزرار التحكم -->
    <div class="controls-container">
        <button class="control-btn" onclick="prevTrack()">⏮ السابق</button>
        <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()">تشغيل ▶</button>
        <button class="control-btn" onclick="nextTrack()">التالي ⏭</button>
    </div>

    <script>
        // قائمة الأغاني بالترتيب
        const playlist = [
            {
                title: "PLAY",
                artist: "فيروز (Reema Rahbany)",
                src: "Fayrouz  PLAY by Reema Rahbany.m4a"
            },
            {
                title: "وحدن",
                artist: "فيروز",
                src: "Wahdon CD 1 TRACK 5 (320).mp3"
            },
            {
                title: "كيفك انت",
                artist: "فيروز",
                src: "Fairuz - Kifak Inta.mp3"
            },
            {
                title: "عندي ثقة فيك",
                artist: "فيروز",
                src: "Fairuz - Indi Thika Feek.mp3"
            }
        ];

        let currentTrackIndex = 0;
        const audio = document.getElementById('audioPlayer');
        const playerWrapper = document.getElementById('playerWrapper');
        const playBtn = document.getElementById('playBtn');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');

        // تحميل الأغنية الحالية
        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
        }

        // تشغيل أو إيقاف
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playerWrapper.classList.add('playing');
                playBtn.textContent = 'إيقاف ⏸';
            } else {
                audio.pause();
                playerWrapper.classList.remove('playing');
                playBtn.textContent = 'تشغيل ▶';
            }
        }

        // الأغنية التالية
        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playerWrapper.classList.add('playing');
            playBtn.textContent = 'إيقاف ⏸';
        }

        // الأغنية السابقة
        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playerWrapper.classList.add('playing');
            playBtn.textContent = 'إيقاف ⏸';
        }

        // عند انتهاء الأغنية -> تشغيل الأغنية التالية تلقائياً
        audio.addEventListener('ended', function () {
            nextTrack();
        });

        // تهيئة المشغل بأول أغنية عند الفتح
        loadTrack(currentTrackIndex);
    </script>
</body>
</html>
